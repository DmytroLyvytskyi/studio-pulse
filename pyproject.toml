[project]
name = "studio-pulse"
version = "0.1.0"
description = "Time tracking and budget insights from Productive for creative agency project managers: an MCP server and a daily chat report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2",
    "pydantic>=2.14.3",
    "pydantic-settings[yaml]>=2.16.2",
    "typer>=0.29.0",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
